<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!-- Material Icons from Google Fonts - Required for icons to render -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <!-- Design System Fonts: Josefin Sans (headings) and Lato (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
    <!-- Frame Builder text fonts: selectable web fonts (guaranteed cross-device) -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@400;600;700&family=Bebas+Neue&family=Caveat:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Fredoka:wght@400;600&family=Montserrat:wght@400;600;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&family=Satisfy&family=Special+Elite&display=swap" rel="stylesheet" />
    
    <!-- Custom Lil Magnet Memories favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=8" />
    <link rel="icon" type="image/png" href="icons/lil-logo.png?v=8" />
    <link rel="shortcut icon" href="favicon.ico?v=8" />
    <link rel="apple-touch-icon" href="icons/lil-logo.png?v=8" />

    <!-- Square Web Payments SDK (production) -->
    <script
      type="text/javascript"
      src="https://web.squarecdn.com/v1/square.js"
    ></script>
    <!-- PayPal SDK - Only load if client ID is configured -->
    <!-- <script
      src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD&enable-funding=venmo,paylater"
      data-sdk-integration-source="button-factory"
    ></script> -->
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
