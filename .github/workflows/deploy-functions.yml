# Deploy Cloud Functions for lil-magnet-memories — mirrors the Starbird setup (Michael 2026-08-22).
#
# ONE-TIME SETUP (browser only, ~2 min):
#   1. Firebase console -> project lil-magnet-memories -> Project settings -> Service accounts ->
#      "Generate new private key" (downloads a JSON).
#   2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#      name FIREBASE_SERVICE_ACCOUNT, value = the entire JSON file contents.
#   3. Tell me — I run the deploy (or Actions tab -> Deploy Cloud Functions -> Run workflow).
#
# The push trigger fires a run when this file changes on dev (workflow_dispatch needs the default branch).
name: Deploy Cloud Functions

on:
  workflow_dispatch:
    inputs:
      only:
        description: "--only filter (empty = all functions)"
        required: false
        default: "functions:dailyOpenOrdersReminder"
  push:
    branches: [dev]
    paths: [".github/workflows/deploy-functions.yml"]

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Deploy to Firebase (project lil-magnet-memories)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          ONLY: ${{ github.event_name == 'push' && 'functions:dailyOpenOrdersReminder' || inputs.only }}
        run: |
          AUTH_ARGS=""
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            AUTH_ARGS="--token $FIREBASE_TOKEN"
          else
            echo "::error::No FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN repo secret set — see the setup comment at the top of this file."
            exit 1
          fi
          if [ -n "$ONLY" ]; then TARGET="$ONLY"; else TARGET="functions"; fi
          npx firebase-tools@13 deploy --only "$TARGET" --project lil-magnet-memories --force --non-interactive $AUTH_ARGS
